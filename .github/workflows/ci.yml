name: Validate analytics
on:
  push:
    branches: [main, "portfolio/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: analytics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install tested environment
        run: python -m pip install -r requirements-dev.txt -e .
      - name: Lint and formatting
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          node --check docs/app.js
      - name: Unit and regression checks
        run: pytest -q
      - name: Rebuild and reconcile evidence
        run: |
          python -m solar_grid build --output artifacts
          python scripts/verify_report.py
      - name: Upload auditable results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solar-grid-evidence
          path: |
            artifacts/metrics.json
            artifacts/monthly_kpis.csv
            artifacts/forecast_test.csv
            artifacts/dispatch.csv
            artifacts/solar.sqlite
          retention-days: 14
      - name: Build and smoke-test container
        run: |
          docker build -t solar-grid:test .
          docker run -d --name solar-grid-test -p 127.0.0.1:8000:8000 solar-grid:test
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8000/data.json -o /tmp/solar-data.json; then break; fi
            sleep 2
          done
          python -c "import json; assert json.load(open('/tmp/solar-data.json'))['input_rows'] == 17544"
          test "$(docker exec solar-grid-test id -u)" = "10001"
      - name: Clean up container
        if: always()
        run: docker rm -f solar-grid-test || true
