[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "solar-grid-impact"
version = "2.0.0"
description = "Reproducible solar forecasting and battery economics case study"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6", "pandas==2.2.3", "scikit-learn==1.6.1"]
[project.optional-dependencies]
presentation = ["matplotlib==3.11.2"]
[project.scripts]
solar-grid = "solar_grid.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
